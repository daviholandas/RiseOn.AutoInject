# SonarQube Configuration for RiseOn.AutoInject
# 
# Required secrets to be configured in GitHub repository settings:
# - SONAR_TOKEN: Authentication token for SonarQube server
# - SONAR_HOST_URL: URL of your SonarQube server (e.g., https://sonarcloud.io)
#
# To set up these secrets:
# 1. Go to GitHub repository > Settings > Secrets and variables > Actions
# 2. Add new repository secrets for SONAR_TOKEN and SONAR_HOST_URL
# 3. For SonarCloud: Get token from https://sonarcloud.io/account/security
# 4. For self-hosted: Get token from your SonarQube instance

# Project identification
sonar.projectKey=daviholandas_RiseOn.AutoInject
sonar.organization=daviholandas
sonar.projectName=RiseOn.AutoInject
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=src/
sonar.tests=tests/
sonar.exclusions=**/bin/**,**/obj/**,**/*.user,**/*.Designer.cs,**/GlobalAssemblyInfo.cs,**/AssemblyInfo.cs,**/packages/**,**/build/**,.nuke/**,samples/**

# Test configuration
sonar.test.inclusions=tests/**/*.cs
sonar.test.exclusions=**/bin/**,**/obj/**

# .NET specific settings
sonar.dotnet.excludeTestProjects=true
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Language configuration
sonar.language=cs

# Coverage and analysis
sonar.coverage.exclusions=tests/**,samples/**,build/**,.nuke/**
sonar.cpd.exclusions=tests/**,samples/**,**/Program.cs

# Additional settings for better analysis
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git