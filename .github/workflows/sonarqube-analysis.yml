name: SonarQube Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Setup JDK 17 (Required for SonarQube)
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install SonarScanner for .NET
      run: |
        dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarQube analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        dotnet sonarscanner begin \
          /k:"daviholandas_RiseOn.AutoInject" \
          /o:"daviholandas" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
          /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
          /d:sonar.coverage.exclusions="tests/**,samples/**,build/**,.nuke/**" \
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/*.user,**/*.Designer.cs,**/packages/**,**/build/**,.nuke/**,samples/**"

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run tests with coverage
      run: |
        dotnet test --no-build --configuration Release \
          --logger trx --results-directory TestResults \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.runsettings || true
          
    - name: Install ReportGenerator for coverage
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
    - name: Generate coverage reports
      run: |
        reportgenerator \
          -reports:"**/coverage.cobertura.xml" \
          -targetdir:"coverage-report" \
          -reporttypes:"OpenCover;Html" || true

    - name: End SonarQube analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    - name: Create SonarQube report directory
      run: |
        mkdir -p sonar-report
        
    - name: Generate SonarQube HTML report (if available)
      run: |
        # Note: HTML report generation requires SonarQube Enterprise or Community edition
        # This step will attempt to download the report if available
        echo "SonarQube analysis completed. Report available at: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=daviholandas_RiseOn.AutoInject" > sonar-report/sonar-analysis-summary.txt
        echo "Analysis timestamp: $(date)" >> sonar-report/sonar-analysis-summary.txt
        echo "Branch: ${{ github.ref_name }}" >> sonar-report/sonar-analysis-summary.txt
        echo "Commit: ${{ github.sha }}" >> sonar-report/sonar-analysis-summary.txt
        
        # Copy coverage report if it exists
        if [ -d "coverage-report" ]; then
          cp -r coverage-report/* sonar-report/ || true
        fi

    - name: Commit SonarQube report
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sonar-report/
        git diff --staged --quiet || git commit -m "Update SonarQube analysis report [skip ci]"
        git push || true

    - name: Upload SonarQube report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonar-report
        path: sonar-report/
        retention-days: 30

    - name: Comment PR with SonarQube results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const sonarUrl = `${{ secrets.SONAR_HOST_URL }}/dashboard?id=daviholandas_RiseOn.AutoInject&pullRequest=${{ github.event.number }}`;
          const comment = `
          ## 📊 SonarQube Analysis Results
          
          SonarQube analysis has been completed for this pull request.
          
          **[View detailed results in SonarQube ↗️](${sonarUrl})**
          
          The analysis report has been uploaded as an artifact and will be available for 30 days.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });